{{ if partial "is-blog.html" . }}
<a href="{{ "blog/" | relURL }}" class="title">
  <h2>{{ site.Params.blogTitle }}</h2>
</a>
<nav>
  <a href="{{ "blog/" | relURL }}">Home</a>
  <a href="{{ (site.GetPage "/tags").RelPermalink }}">Categories</a>
  <a href="{{ "" | relURL }}">My Site</a>
</nav>
{{ else }}
<a href="{{ "" | relURL }}" class="title">
  <h2>{{ .Site.Title }}</h2>
</a>
<nav>{{- partial "nav.html" . -}}</nav>
{{ end }}
