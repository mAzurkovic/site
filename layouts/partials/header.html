{{- $isBlog := partial "is-blog.html" . }}
<div class="header-bar">
  {{- if $isBlog }}
  <a href="{{ "blog/" | relURL }}" class="title">
    <h2>{{ site.Params.blogTitle }}</h2>
  </a>
  {{- else }}
  <a href="{{ "" | relURL }}" class="title">
    <h2>{{ .Site.Title }}</h2>
  </a>
  {{- end }}
  <div class="header-actions">
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
      <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>
{{- if $isBlog }}
<nav id="site-nav">
  <a href="{{ "blog/" | relURL }}"{{ if eq .RelPermalink ("blog/" | relURL) }} class="active"{{ end }}>Home</a>
  {{- $tags := (site.GetPage "/tags").RelPermalink }}
  <a href="{{ $tags }}"{{ if hasPrefix .RelPermalink $tags }} class="active"{{ end }}>Categories</a>
  <a href="{{ "" | relURL }}">My Site</a>
</nav>
{{- else }}
<nav id="site-nav">{{- partial "nav.html" . -}}</nav>
{{- end }}
<script>
  document.querySelector(".theme-toggle").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.dataset.theme
      ? root.dataset.theme === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  });
  document.querySelector(".nav-toggle").addEventListener("click", function () {
    var open = this.getAttribute("aria-expanded") !== "true";
    this.setAttribute("aria-expanded", open);
    document.getElementById("site-nav").classList.toggle("open", open);
  });
</script>
